<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="impact-site-verification" value="549f4159-6ac1-48fb-a3f9-6ab1b53b515c">
  <title>Belle Trouvé — Fashion Discovered</title>
  <meta name="description" content="Belle Trouvé curates trending fashion from Instagram, TikTok and Pinterest — apparel, shoes, handbags, jewelry, accessories and beauty.">
  <meta name="theme-color" content="#0A1128">

  <!-- 1) Restore the real path when GitHub Pages bounced us through 404.html
       2) Upgrade any old #/ links from the first preview build
       3) Apply saved theme before first paint (no light/dark flash) -->
  <script>
    try {
      var r = sessionStorage.getItem('bt-redirect');
      if (r) { sessionStorage.removeItem('bt-redirect'); history.replaceState(null, '', r); }
    } catch (e) {}
    if (location.hash.indexOf('#/') === 0) history.replaceState(null, '', location.hash.slice(1) || '/');
    try {
      var t = localStorage.getItem('bt-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
    // iPhone Safari proper (not Chrome/Firefox/Edge/Opera/Google app on iOS) gets a class for Safari-only layout tweaks
    try {
      var ua = navigator.userAgent;
      if (/iPhone|iPod/.test(ua) && /Version\/[\d.]+.*Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|GSA/.test(ua)) {
        document.documentElement.classList.add('ios-safari');
      }
    } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <div class="app">
    <!-- Desktop (≥1280px): persistent left sidebar -->
    <aside class="sidebar" aria-label="Primary">
      <a class="wordmark" href="/">Belle <span>Trouvé</span></a>
      <nav class="sidenav" data-nav="side"></nav>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-bottom">
        <div class="sidebar-divider"></div>
        <button class="sidelink" type="button" data-action="toggle-theme">
          <span data-icon="moon"></span><span>Appearance</span>
        </button>
        <button class="sidelink" type="button" data-action="open-menu">
          <span data-icon="menu"></span><span>Menu</span>
        </button>

    </aside>

    <div class="main">
      <!-- Tablet (768–1279px): top pill nav + menu button -->

        <nav class="topnav" data-nav="top" aria-label="Primary"></nav>
        <button class="menu-btn" type="button" data-action="open-menu" aria-label="Open menu">
          <span data-icon="menu"></span>

      <main id="view" class="content" tabindex="-1"></main>

    <!-- Phone (<768px): floating bottom tab bar -->

    <button class="to-top" type="button" aria-label="Back to top" data-action="to-top">
      <span data-icon="chevronUp"></span>
    </button>
  </div>

  <!-- Hamburger menu (sheet on phone, dialog on tablet/desktop) -->
  <div class="sheet-backdrop" data-action="close-menu" hidden></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="menuTitle" hidden>
    <div class="sheet-grabber"></div>
    <div class="sheet-head">
      <span class="sheet-head-spacer"></span>
      <h2 id="menuTitle">Menu</h2>
      <button class="done-btn" type="button" data-action="close-menu">Done</button>
    </div>
    <div class="sheet-body">
      <p class="menu-section">Appearance</p>
      <div class="menu-row">
        <span class="menu-icon" data-icon="moon"></span>
        <span class="menu-label">Dark Mode</span>
        <button class="switch" type="button" role="switch" aria-checked="true" aria-label="Dark Mode" data-action="toggle-theme"><span></span></button>
      </div>

      <div class="menu-divider"></div>
      <p class="menu-section">Get the App</p>
      <a class="appstore-badge" data-appstore-link href="#" target="_blank" rel="noopener" aria-label="Download Belle Trouvé on the App Store">
        <img class="badge-on-dark" src="/img/app-store-badge-black.svg" alt="Download on the App Store" width="144" height="48">
        <img class="badge-on-light" src="/img/app-store-badge-white.svg" alt="Download on the App Store" width="144" height="48">
      </a>

      <div class="menu-divider"></div>
      <p class="menu-section">Support</p>
      <a class="menu-row" href="mailto:chporter72@belletrouve.com?subject=Belle%20Trouv%C3%A9%20Support">
        <span class="menu-icon" data-icon="mail"></span>
        <span class="menu-label">Contact Support</span>
        <span class="menu-chevron" data-icon="chevronRight"></span>
      </a>

      <div class="menu-divider"></div>
      <p class="menu-section">Legal</p>
      <a class="menu-row" href="/privacy/">
        <span class="menu-icon" data-icon="hand"></span>
        <span class="menu-label">Privacy Statement</span>
        <span class="menu-chevron" data-icon="chevronRight"></span>
      </a>
      <a class="menu-row" href="/affiliate-disclosure" data-action="close-menu">
        <span class="menu-icon" data-icon="tag"></span>
        <span class="menu-label">Affiliate Disclosure</span>
        <span class="menu-chevron" data-icon="chevronRight"></span>
      </a>

      <div class="menu-divider"></div>
      <p class="menu-version">Belle Trouvé for Web · Preview</p>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
